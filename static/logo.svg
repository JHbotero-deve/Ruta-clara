<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="220" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#334155" stroke-width="6"/>

  <!-- Grid lines / Map pattern -->
  <path d="M 100 250 H 400 M 250 100 V 400" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="250" cy="250" r="120" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Connecting Route Line -->
  <path d="M 160 320 Q 220 180 340 160 T 360 300" fill="none" stroke="url(#routeGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Route Nodes (Pins) -->
  <circle cx="160" cy="320" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
  <circle cx="340" cy="160" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
  <circle cx="360" cy="300" r="10" fill="#f97316" stroke="#ffffff" stroke-width="3"/>

  <!-- Center Location Pin -->
  <g transform="translate(250, 190) scale(1.2)" filter="url(#shadow)">
    <path d="M 0 -35 C -15 -35 -25 -20 -25 -5 C -25 15 0 35 0 35 C 0 35 25 15 25 -5 C 25 -20 15 -35 0 -35 Z" fill="url(#pinGrad)"/>
    <circle cx="0" cy="-8" r="8" fill="#ffffff"/>
  </g>

  <!-- App Title Text -->
  <text x="250" y="405" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">RUTA CLARA</text>
  <text x="250" y="430" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">OPTIMIZADOR DE RUTAS &amp; GPS</text>
</svg>
