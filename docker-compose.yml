
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ruta-clara-web

    ports:
      - "8004:8000"

    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY debe configurarse en .env}
      DATABASE_URL: sqlite:////app/data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8004}

    volumes:
      - ruta_clara_data:/app/data

    restart: unless-stopped

    init: true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ruta_clara_data:
    name: ruta-clara-data
