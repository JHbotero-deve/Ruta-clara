name: Ruta Clara checks
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Python syntax
        run: python -m compileall -q src tests
      - name: Backend tests
        run: pytest -q
      - name: Inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.inline = not any(key == "src" for key, _ in attrs)
                      self.current = []

              def handle_data(self, data):
                  if self.inline:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.inline:
                      self.scripts.append("".join(self.current))
                      self.inline = False

          parser = ScriptParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(parser.scripts):
                  if not script.strip():
                      continue
                  file = Path(directory) / f"inline-{index}.js"
                  file.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(file)], check=True)
          print(f"Validación JavaScript: {len(parser.scripts)} bloques inline revisados")
          PY